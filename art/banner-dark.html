<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#EEF3FA;
  background:
    radial-gradient(820px 460px at 50% 118%,rgba(78,212,150,.15),transparent 72%),
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0) 0 0/26px 26px,
    #0D1117;}
.page{width:100%;height:100%;padding:44px 56px 40px;display:flex;flex-direction:column}

h1{font-size:50px;font-weight:800;letter-spacing:-.035em;line-height:1}
h1 .a{color:#4ED496}
.sub{margin-top:12px;font-size:21px;font-weight:450;color:#919AA7;letter-spacing:-.012em}
.tag{font-size:25px;font-weight:700;letter-spacing:-.022em}
.tag .a{color:#4ED496}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;min-height:0}

.win{background:#161B22;border:1px solid rgba(255,255,255,.10);border-radius:18px;
  box-shadow:0 18px 44px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(255,255,255,.04);
  border-bottom:1px solid rgba(255,255,255,.10);flex:0 0 auto}
.bar .t{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:#8B94A3;text-transform:uppercase}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:6px 14px;
  font-size:12.5px;color:#8B94A3;font-weight:500}
.pad{padding:18px;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.mono{font-family:'JetBrains Mono',Consolas,monospace;color:#D7DFEA}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  color:#8B94A3;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.10);padding:5px 11px;
  border-radius:999px;white-space:nowrap}
.chip.on{color:#fff;background:#4ED496;border-color:transparent}
.ok{display:inline-flex;align-items:center;gap:7px;background:rgba(63,185,80,.16);color:#4FC463;
  font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px}
.warn{background:rgba(240,160,60,.16);color:#F0A83C}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.muted{color:#919AA7}
.accent{color:#4ED496}
.row{display:flex;align-items:center;gap:11px}
.grow{flex:1}
.logo{filter:drop-shadow(0 14px 30px rgba(0,0,0,.30))}

.panes{display:flex;align-items:center;gap:22px;width:100%}
.pane{flex:1;min-width:0}
.lbl{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:#8B94A3;margin-bottom:10px}
.pubrow{display:flex;align-items:center;gap:11px;font-size:14px;color:#919AA7;
  padding:9px 0}
.pubrow + .pubrow{border-top:1px solid rgba(255,255,255,.10)}
.pubico{width:30px;height:38px;border-radius:5px;background:rgba(255,255,255,.18);flex:0 0 auto}
.card2{background:#fff;border-radius:10px;padding:16px;box-shadow:0 10px 26px rgba(0,0,0,.18);
  position:relative}
.card2 .hd{height:30px;border-radius:7px;background:linear-gradient(90deg,#1F9E62,#0C6B42);
  margin-bottom:12px}
.card2 i{display:block;height:8px;border-radius:4px;background:#CBD6CF;margin-bottom:8px}
.hnd{position:absolute;width:11px;height:11px;border-radius:3px;background:#4ED496}

</style></head><body><div class="page">
<div class="row" style="gap:20px;flex:0 0 auto"><img class="logo" src="../build/logo.png" width="78" height="78" style="flex:0 0 auto;"><div><h1>Bohpum</h1><div class="sub">Open, edit and print Microsoft Publisher files</div></div></div><div class="mid"><div class="panes"><div class="pane"><div class="lbl">Before</div><div class="win"><div class="pad" style="justify-content:flex-start"><div class="pubrow"><span class="pubico"></span>invitation.pub<span class="grow"></span><span class="chip" style="color:#F0A83C">no app</span></div><div class="pubrow"><span class="pubico"></span>certificate.pub<span class="grow"></span><span class="chip" style="color:#F0A83C">no app</span></div><div class="pubrow"><span class="pubico"></span>flyer-khmer.pub<span class="grow"></span><span class="chip" style="color:#F0A83C">no app</span></div><div class="sub" style="font-size:14px;margin-top:14px">Windows has nothing that opens these.</div></div></div></div><svg width="54" height="14" viewBox="0 0 54 14" style="flex:0 0 auto"><path d="M2 7 H40" stroke="#4ED496" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="1 9"/><path d="M38 1.5 L48 7 L38 12.5" fill="none" stroke="#4ED496" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="pane"><div class="lbl">With Bohpum</div><div class="win"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="t">Bohpum</span><span class="grow"></span><span class="chip on">4 on A4</span></div><div class="pad"><div class="card2"><div class="hnd" style="left:-5px;top:-5px"></div><div class="hnd" style="right:-5px;top:-5px"></div><div class="hnd" style="left:-5px;bottom:-5px"></div><div class="hnd" style="right:-5px;bottom:-5px"></div><div class="hd"></div><i style="width:82%"></i><i style="width:64%"></i><i style="width:92%"></i><i style="width:48%"></i></div></div></div></div></div></div><div class="tag" style=";margin-top:0px;flex:0 0 auto">Your old .pub files. <span class="a">No Publisher needed.</span></div>
</div></body></html>
