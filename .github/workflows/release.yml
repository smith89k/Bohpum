# Builds the Microsoft Store package and makes it a GitHub release (store.js, build/store.config.js): download
# Bohpum-Store-<version>.msix from the release and submit it in Partner Center; Microsoft signs it and the Store updates
# installed copies (docs/updates-setup.md section 8). Since 0.2.5 there is no installer and nothing goes to R2: copies
# installed from an installer stay on 0.2.4 (R2 still serves it, and the Publisher reader pack, to them).
# The Publisher reader (a trimmed LibreOffice, the one pinned in libreoffice.json) goes inside the package: built here
# from The Document Foundation's MSI on every release.
# Runs only by hand: Actions > Release > Run workflow, type the version (= package.json), or
#   gh workflow run release.yml -f version=0.2.5
# Pushing code or tags never releases.
#
# Three jobs, each on its own fresh machine, and no secret at all: "check" (the GitHub token, installs nothing) — the
# version and store.json; "build" runs other people's code (pnpm install, the MSI unpack, electron-builder) with no
# token; "publish" (the GitHub token, installs nothing) makes the GitHub release with the package.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, the same as package.json (e.g. 0.2.5)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  MSIX: Bohpum-Store-${{ inputs.version }}.msix

jobs:
  # Before anything is built: the version, and the Store identity the package is built with.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: The version matches package.json, is not released yet, and store.json holds the Store identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "$v" != "$VERSION" ]; then
            echo "::error::You typed $VERSION, but package.json says $v. Bump package.json, push main, then run again."; exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released. Bump the version for a new release."; exit 1
          fi
          node -e "if (!require('./store').readStoreInfo('store.json')) { console.error('::error::store.json is missing or not valid: see docs/updates-setup.md section 8'); process.exit(1); }"

  # Other people's code runs here (pnpm install, the MSI, electron-builder): no secret, no GitHub token.
  build:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6   # the pnpm version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (fetches Electron)
        run: pnpm install --frozen-lockfile

      - name: Check What's new has notes for this version (src/notes.js)
        run: node scripts/check-notes.js

      - name: "The Publisher reader: download LibreOffice from The Document Foundation and check its SHA-256"
        run: |
          url="$(node -p "require('./libreoffice.json').msi")"
          want="$(node -p "require('./libreoffice.json').sha256")"
          curl -fL --retry 3 -o lo.msi "$url"
          got="$(sha256sum lo.msi | cut -d' ' -f1)"
          if [ "$got" != "$want" ]; then echo "::error::The LibreOffice MSI's SHA-256 is $got, libreoffice.json says $want"; exit 1; fi
          echo "lo.msi: $(stat -c %s lo.msi) bytes, SHA-256 matches libreoffice.json"

      # An administrative install only unpacks the MSI's files into a folder: nothing is installed on the runner.
      - name: "The Publisher reader: unpack the MSI"
        shell: pwsh
        run: |
          $p = Start-Process msiexec -ArgumentList '/a', "$pwd\lo.msi", '/qn', "TARGETDIR=$pwd\lo-admin" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error::msiexec /a ended with $($p.ExitCode)"; exit 1 }

      # scripts/reader-pack.js trims it into dist-reader/LibreOffice, where build/store.config.js takes it from.
      - name: "The Publisher reader: trim it, and check it opens a Publisher file"
        run: |
          soffice="$(find lo-admin -type f -iname soffice.exe -path '*program*' | head -1)"
          if [ -z "$soffice" ]; then echo "::error::The unpacked MSI has no program/soffice.exe"; find lo-admin -maxdepth 3; exit 1; fi
          node scripts/reader-pack.js "$(dirname "$(dirname "$soffice")")" dist-reader
          node scripts/reader-check.js dist-reader/LibreOffice/program/soffice.exe samples/demo-card.pub

      - name: Build the File Explorer menu (C++ DLL; needs the runner's Visual Studio + Windows SDK)
        run: node scripts/build-explorer-menu.js

      - name: Build the Store package
        run: pnpm exec electron-builder --win appx --publish never --config build/store.config.js

      - name: The package has the reader and the menu, and no update key
        run: node scripts/store-check.js dist-store "$MSIX"

      - uses: actions/upload-artifact@v7
        with:
          name: store
          path: dist-store/${{ env.MSIX }}
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  # Only the built package and this repository's own scripts (nothing installed), with the GitHub token.
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the tag and the GitHub release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: store
          path: dist-store

      - name: GitHub release (notes from What's new)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.js "$VERSION" > notes.md
          printf '\nThe Publisher reader (LibreOffice %s) is inside the package.\n' "$(node -p "require('./libreoffice.json').version")" >> notes.md
          printf '\n%s is for the Microsoft Store: submit it in Partner Center (docs/updates-setup.md section 8). Microsoft signs it.\n\nSHA-256 of the package: `%s`\n' \
            "$MSIX" "$(sha256sum "dist-store/$MSIX" | cut -d' ' -f1)" >> notes.md
          gh release create "v$VERSION" "dist-store/$MSIX" --target "$GITHUB_SHA" --title "Bohpum $VERSION" --notes-file notes.md
