# Builds the Windows installer on GitHub from the public code: SignPath Foundation signs only builds made this way.
# A pushed tag vX.Y.Z (= package.json's version) → build → signing in SignPath, once it is set up (repo variable
# SIGNPATH_ORGANIZATION_ID + secret SIGNPATH_API_TOKEN; each request waits for an approval there) → a GitHub release
# with the installer and the version's What's new. Run by hand (Actions → Release → Run workflow) it only builds and
# keeps the installer as a run artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025 # Visual Studio C++ tools + Windows SDK for the Explorer menu add-on (npm run build:menu)
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Version (a tag must be v + package.json's version)
        id: version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$v (package.json's version)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install LibreOffice (npm run dist bundles it into the installer)
        run: choco install libreoffice-fresh -y --no-progress
      - run: npm ci
      - run: npm run dist
      - name: Keep the installer
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/Bohpum Setup ${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

  sign:
    needs: build
    if: github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Bohpum
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21000 # time to approve it in SignPath
          output-artifact-directory: signed
      - uses: actions/upload-artifact@v7
        with:
          name: installer-signed
          path: signed/
          if-no-files-found: error

  release:
    needs: [build, sign]
    # unsigned until SignPath is set up (sign skipped); never unsigned when signing was tried and failed
    if: always() && github.ref_type == 'tag' && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sign.result == 'success' && 'installer-signed' || 'installer' }}
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node scripts/release-notes.js "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" out/*.exe --title "Bohpum $VERSION" --notes-file notes.md
